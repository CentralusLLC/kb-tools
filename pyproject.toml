[project]
name = "kb-tools"
version = "0.1.0"
description = "Ingest documents into OKF knowledge bases and report on their trust: inventory, extraction, rendering, figures, checks, MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CentralusLLC" }]
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.5",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
server = ["mcp>=1.12,<2"]
facts = ["langextract>=1.0"]
dev = ["pytest>=8", "python-docx>=1.1"]

[project.scripts]
kb = "kbtools.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
